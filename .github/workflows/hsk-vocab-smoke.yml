name: HSK vocabulary 2.1 integration audit
on:
  push:
    paths:
      - ".github/workflows/hsk-vocab-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vocab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify GitHub Pages publication of v2.1
        shell: bash
        run: |
          set -euo pipefail
          base="https://thanhhochub-commits.github.io/HSK/"
          for i in $(seq 1 50); do
            curl -fsSL --max-time 20 "$base" -o /tmp/hsk-index.html
            if grep -q 'hsk-vocab-pdf-integrated-v2.1.1' /tmp/hsk-index.html; then break; fi
            sleep 5
          done
          grep -q 'hsk-vocab-pdf-integrated-v2.1.1' /tmp/hsk-index.html
          ! grep -q 'hsk-drive-catalog-v1.js' /tmp/hsk-index.html
          grep -q 'hsk-billing-v18-1.js' /tmp/hsk-index.html
          grep -q 'app-hsk-billing-v21.js' /tmp/hsk-index.html
          mkdir -p /tmp/hsk
          for x in \
            hsk-study-content-v20.js \
            hsk-vocab-list-1-v21.js \
            hsk-vocab-list-2-v21.js \
            hsk-vocab-list-3-v21.js \
            hsk-vocab-list-4-v21.js \
            hsk-vocab-list-5-v21.js \
            hsk-vocab-list-6-v21.js \
            hsk-vocab-list-79-a-v21.js \
            hsk-vocab-list-79-b-v21.js \
            hsk-vocab-list-79-c-v21.js \
            hsk-vocab-list-79-d-v21.js \
            hsk-vocab-corrections-v21.js \
            app-hsk-billing-v21.js; do
            curl -fsSL --retry 4 --retry-all-errors --max-time 30 "$base$x" -o "/tmp/hsk/$x"
            node --check "/tmp/hsk/$x"
          done
      - name: Validate all seven HSK vocabulary levels and UI navigation
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const root='/tmp/hsk/';
          const scripts=['hsk-study-content-v20.js'];
          for(const n of [1,2,3,4,5,6])scripts.push('hsk-vocab-list-'+n+'-v21.js');
          for(const n of ['a','b','c','d'])scripts.push('hsk-vocab-list-79-'+n+'-v21.js');
          scripts.push('hsk-vocab-corrections-v21.js');
          const ev={},st={},elems={};
          const rootApp={innerHTML:''};
          let hash='#vocab';
          const window={HSKPayment:{configured:true,pro:false,user:null,live:true},addEventListener:(n,f)=>ev['w_'+n]=f,scrollTo:()=>{},devicePixelRatio:1};
          const empty=()=>({innerHTML:'',value:'',textContent:'',style:{},addEventListener(){},getContext(){return {clearRect(){}}}});
          const document={getElementById:(k)=>k==='app'?rootApp:(elems[k]||=empty()),addEventListener:(n,f)=>ev['d_'+n]=f,querySelectorAll:()=>[],documentElement:{},hidden:false};
          const localStorage={getItem:k=>st[k]||null,setItem:(k,v)=>st[k]=v};
          const location={get hash(){return hash},set hash(v){hash=v.startsWith('#')?v:'#'+v},origin:'https://thanhhochub-commits.github.io'};
          const global={window,document,location,localStorage,sessionStorage:{setItem(){}},setInterval:()=>1,alert:()=>{},confirm:()=>true,console};
          for(const s of scripts)vm.runInNewContext(fs.readFileSync(root+s,'utf8'),global,{filename:s});
          const raw=window.HSK_VOCAB_IMPORTED;
          assert(raw.length>=11000,'at least 11k raw rows');
          assert.equal(window.HSK_VOCAB_CORRECTIONS.length,111);
          vm.runInNewContext(fs.readFileSync(root+'app-hsk-billing-v21.js','utf8'),global,{filename:'app-hsk-billing-v21.js'});
          const expected={1:300,2:273,3:507,4:1000,5:1600,6:1800,79:5600};
          const meta={};
          for(const [k,v] of Object.entries(expected)){
            const source=[...raw,...window.HSK_VOCAB_CORRECTIONS];
            const by=new Map(source.filter(x=>x.level===Number(k)).map(x=>[x.n,x]));
            if(k==='2')for(const n of [72,74,100,130])by.delete(n);
            const good=[...by.values()].filter(x=>x.h&&x.p&&x.v);
            meta[k]=good.length;
            assert.equal(good.length,v,'count for HSK '+k);
          }
          assert(rootApp.innerHTML.includes('Từ vựng HSK 1–9'));
          assert(elems.vocabCount.textContent.includes('Trang 1'));
          assert((elems.vocabResults.innerHTML.match(/class="panel word-card hsk-vocab-card"/g)||[]).length<=36);
          assert(elems.vocabResults.innerHTML.includes('data-action="learn"'));
          assert(!rootApp.innerHTML.includes('data-to="library"'));
          // Browse source data in current level; existing study pages are left intact.
          const click=(action,id,to)=>ev.d_click({target:{closest:()=>({dataset:{action,...(id===undefined?{}:{id:String(id)}),...(to?{to}:{})},disabled:false})}});
          click('nav',undefined,'flashcards');
          assert(rootApp.innerHTML.includes('Flashcard + SRS'));
          click('nav',undefined,'roadmap');
          assert(rootApp.innerHTML.includes('Lộ trình HSK 1–9'));
          click('nav',undefined,'pro');
          for(const p of ['89.000đ','219.000đ','699.000đ'])assert(rootApp.innerHTML.includes(p));
          console.log('PASS: published 2.1; counts',meta,'; vocab pagination; flashcard; roadmap; payOS Pro plans intact');
          JS
